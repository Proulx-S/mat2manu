<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- mat2manu example layout: synthetic, 178 mm (PNAS two-column) -->
<svg width="178mm" height="140mm" viewBox="0 0 178 140" version="1.1" id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview id="namedview1" inkscape:document-units="mm" showgrid="false"/>
  <g inkscape:groupmode="layer" id="layer_layout" inkscape:label="layout">
    <rect id="boxA" inkscape:label="A" x="12" y="6" width="50" height="32" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxA_leg" inkscape:label="A.leg" x="64" y="6" width="24" height="10" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxAinset" inkscape:label="Ainset" x="42" y="8" width="18" height="11" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxB" inkscape:label="B" x="100" y="6" width="38" height="32" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxB_cb" inkscape:label="B.cb" x="140" y="6" width="2.5" height="32" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxC" inkscape:label="C" x="12" y="52" width="38" height="30" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxD" inkscape:label="D" x="64" y="52" width="38" height="30" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxE" inkscape:label="E" x="116" y="52" width="56" height="30" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxF" inkscape:label="F" x="12" y="98" width="56" height="30" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxF_leg" inkscape:label="F.leg" x="70" y="98" width="19" height="7" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
    <rect id="boxG" inkscape:label="G" x="100" y="98" width="72" height="30" style="fill:#4a90d9;fill-opacity:0.25;stroke:none"/>
  </g>
  <g inkscape:groupmode="layer" id="layer_annot" inkscape:label="annotations">
    <g id="arrowA">
      <path id="arrowA_shaft" d="M 30,9 L 25.6,14.2" style="fill:none;stroke:#c0392b;stroke-width:0.25"/>
      <path id="arrowA_head" d="M 24.9,15.1 L 25.1,13.6 L 26.2,14.5 Z" style="fill:#c0392b;stroke:none"/>
    </g>
    <text id="noteA" x="30.5" y="8.6" style="font-family:Arial;font-size:2.1167px;fill:#c0392b">peak</text>
    <path id="bracketD" d="M 74,50.5 L 74,49.5 L 90,49.5 L 90,50.5" style="fill:none;stroke:#000000;stroke-width:0.18"/>
    <text id="starD" x="82" y="49" style="font-family:Arial;font-size:2.4694px;text-anchor:middle;fill:#000000">**</text>
  </g>
  <g inkscape:groupmode="layer" id="layer_letters" inkscape:label="letters">
    <text id="letter_a" x="4" y="8.6" style="font-family:Arial;font-weight:bold;font-size:2.8222px;fill:#000000">A</text>
    <text id="letter_b" x="90" y="8.6" style="font-family:Arial;font-weight:bold;font-size:2.8222px;fill:#000000">B</text>
    <text id="letter_c" x="4" y="54.6" style="font-family:Arial;font-weight:bold;font-size:2.8222px;fill:#000000">C</text>
    <text id="letter_d" x="56" y="54.6" style="font-family:Arial;font-weight:bold;font-size:2.8222px;fill:#000000">D</text>
    <text id="letter_e" x="106" y="54.6" style="font-family:Arial;font-weight:bold;font-size:2.8222px;fill:#000000">E</text>
    <text id="letter_f" x="4" y="100.6" style="font-family:Arial;font-weight:bold;font-size:2.8222px;fill:#000000">F</text>
    <text id="letter_g" x="90" y="100.6" style="font-family:Arial;font-weight:bold;font-size:2.8222px;fill:#000000">G</text>
  </g>
